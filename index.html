<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GigaEarn MiniApp</title>
  
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <!-- Adsgram SDK -->
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-green: #10b981;
      --accent-blue: #3b82f6;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .balance-card {
      background: linear-gradient(135deg, #4f46e5, #9333ea);
      text-align: center;
      padding: 24px 16px;
    }

    .balance-title {
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
      opacity: 0.8;
    }

    .balance-text {
      font-size: 32px;
      font-weight: bold;
      margin-top: 4px;
    }

    .section-title {
      font-size: 16px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .action-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .action-info h4 {
      font-size: 15px;
    }

    .action-info p {
      font-size: 12px;
      color: var(--text-muted);
    }

    .reward-text {
      color: var(--accent-green);
      font-size: 13px;
      font-weight: 600;
    }

    .btn {
      background-color: var(--accent-blue);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
    }

    .btn:disabled {
      background-color: #475569;
      color: #94a3b8;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <!-- Balance Section -->
  <div class="card balance-card">
    <div class="balance-title">Total Balance</div>
    <div class="balance-text" id="balanceDisplay">100 Shards</div>
  </div>

  <!-- Daily Bonus -->
  <div class="section-title">⚡ Daily Bonus</div>
  <div class="card">
    <div class="action-row">
      <div class="action-info">
        <h4>Daily Check-In</h4>
        <div class="reward-text">+50 Shards</div>
      </div>
      <button class="btn" id="checkInBtn" onclick="claimDaily()">Check In</button>
    </div>
  </div>

  <!-- Watch & Earn -->
  <div class="section-title">🎬 Watch & Earn</div>
  <div class="card">
    <div class="action-row">
      <div class="action-info">
        <h4>Watch Video Ad</h4>
        <p>Watch a short video</p>
        <div class="reward-text">+25 Shards</div>
      </div>
      <button class="btn" onclick="watchAd()">Watch</button>
    </div>
  </div>

  <!-- Invite Friends -->
  <div class="section-title">👥 Invite Friends</div>
  <div class="card">
    <div class="action-row">
      <div class="action-info">
        <h4>Invite a Friend</h4>
        <p>Earn bonuses for every referral</p>
        <div class="reward-text">+150 Shards / friend</div>
      </div>
      <button class="btn" onclick="inviteFriend()">Invite</button>
    </div>
  </div>

  <script>
    // 1. Initialize Telegram WebApp
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // 2. Load Saved Balance or Default to 100
    let balance = parseInt(localStorage.getItem('user_balance')) || 100;
    updateBalanceDisplay();

    // Check if Daily Check-In was already done today
    const lastCheckIn = localStorage.getItem('last_checkin_date');
    const today = new Date().toDateString();
    if (lastCheckIn === today) {
      const checkInBtn = document.getElementById('checkInBtn');
      if (checkInBtn) {
        checkInBtn.innerText = "Done ✓";
        checkInBtn.disabled = true;
      }
    }

    // Function to update screen balance and save to local storage
    function updateBalanceDisplay() {
      document.getElementById('balanceDisplay').innerText = `${balance} Shards`;
      localStorage.setItem('user_balance', balance);
    }

    // 3. Daily Check-in Function
    function claimDaily() {
      if (localStorage.getItem('last_checkin_date') === today) return;

      balance += 50;
      updateBalanceDisplay();
      
      localStorage.setItem('last_checkin_date', today);
      const btn = document.getElementById('checkInBtn');
      btn.innerText = "Done ✓";
      btn.disabled = true;

      alert("Success! You claimed +50 Shards.");
    }

    // 4. Initialize Adsgram with your Block ID (39761)
    const AdController = window.Adsgram ? window.Adsgram.init({ blockId: "39761" }) : null;

    // Watch Ad Function
    function watchAd() {
      if (!AdController) {
        alert("Ad provider is still loading or unavailable. Please try again in a moment.");
        return;
      }

      AdController.show().then((result) => {
        // Ad watched successfully
        balance += 25;
        updateBalanceDisplay();
        alert("Awesome! You watched the ad and earned +25 Shards.");
      }).catch((result) => {
        // Ad skipped or failed to load
        alert("Ad was skipped or failed to load. No reward granted.");
      });
    }

    // 5. Invite Friends Function
    function inviteFriend() {
      const botUsername = "Watch2EarnHub_bot";
      const userId = tg.initDataUnsafe?.user?.id || "";
      const shareUrl = `https://t.me/share/url?url=https://t.me/${botUsername}?start=ref_${userId}&text=${encodeURIComponent("Join GigaEarn and start earning Shards today!")}`;
      
      tg.openTelegramLink(shareUrl);
    }
  </script>
</body>
</html>
