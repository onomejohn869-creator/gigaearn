<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GigaEarn MiniApp</title>
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Adsgram SDK -->
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-green: #10b981;
      --accent-blue: #3b82f6;
      --text-main: #f8fafc;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      padding-bottom: 80px;
    }
    .header-card {
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      padding: 20px;
      border-radius: 16px;
      text-align: center;
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .balance-title { font-size: 14px; opacity: 0.9; text-transform: uppercase; letter-spacing: 1px; }
    .balance-amount { font-size: 32px; font-weight: 800; margin-top: 5px; }
    
    .section-title { font-size: 18px; font-weight: 700; margin: 20px 0 10px 0; }
    
    .task-card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .task-info h4 { margin: 0 0 4px 0; font-size: 16px; }
    .task-info p { margin: 0; font-size: 13px; color: #94a3b8; }
    .reward-badge { color: #34d399; font-weight: 600; font-size: 13px; }
    
    .btn {
      background-color: var(--accent-blue);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }
    .btn-success { background-color: var(--accent-green); }
    .btn-disabled { background-color: #475569; cursor: not-allowed; }
  </style>
</head>
<body>

  <!-- BALANCE DISPLAY -->
  <div class="header-card">
    <div class="balance-title">Total Balance</div>
    <div class="balance-amount"><span id="balance">0</span> Shards</div>
  </div>

  <!-- DAILY REWARD -->
  <div class="section-title">⚡ Daily Bonus</div>
  <div class="task-card">
    <div class="task-info">
      <h4>Daily Check-In</h4>
      <div class="reward-badge">+50 Shards</div>
    </div>
    <button id="dailyBtn" class="btn btn-success" onclick="claimDaily()">Claim</button>
  </div>

  <!-- ADS SECTION -->
  <div class="section-title">🎬 Watch & Earn</div>
  <div class="task-card">
    <div class="task-info">
      <h4>Watch Video Ad</h4>
      <p>Watch a short 15s video</p>
      <div class="reward-badge">+25 Shards</div>
    </div>
    <button class="btn" onclick="watchAd()">Watch</button>
  </div>

  <!-- REFERRAL SECTION -->
  <div class="section-title">👥 Invite Friends</div>
  <div class="task-card">
    <div class="task-info">
      <h4>Invite a Friend</h4>
      <p>Earn bonuses for every referral</p>
      <div class="reward-badge">+150 Shards / friend</div>
    </div>
    <button class="btn" onclick="copyReferral()">Invite</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // Balance Logic
    let balance = parseInt(localStorage.getItem('user_balance')) || 0;
    function updateBalance(amount) {
      balance += amount;
      localStorage.setItem('user_balance', balance);
      document.getElementById('balance').innerText = balance;
    }
    document.getElementById('balance').innerText = balance;

    // Daily Claim Logic
    const lastClaim = localStorage.getItem('last_daily_claim');
    const today = new Date().toDateString();
    if (lastClaim === today) setBtnClaimed('dailyBtn');

    function claimDaily() {
      if (localStorage.getItem('last_daily_claim') === today) return;
      updateBalance(50);
      localStorage.setItem('last_daily_claim', today);
      setBtnClaimed('dailyBtn');
      tg.showAlert("You claimed 50 daily Shards!");
    }

    // Adsgram Rewarded Ad
    function watchAd() {
      if (typeof AdController !== 'undefined') {
        AdController.show({ blockId: "YOUR_ADSGRAM_BLOCK_ID" }).then(() => {
          updateBalance(25);
          tg.showAlert("Success! You earned 25 Shards.");
        }).catch(() => {
          tg.showAlert("Ad failed to load or was closed early.");
        });
      } else {
        updateBalance(25);
        tg.showAlert("Demo Mode: +25 Shards added!");
      }
    }

    // Referral Copy Logic
    function copyReferral() {
      const userId = tg.initDataUnsafe?.user?.id || 'user';
      const refLink = `https://t.me/Watch2EarnHub_bot?start=ref_${userId}`;
      navigator.clipboard.writeText(refLink);
      tg.showAlert("Referral link copied to clipboard!");
    }

    function setBtnClaimed(btnId) {
      const btn = document.getElementById(btnId);
      if (btn) {
        btn.innerText = "Done ✓";
        btn.classList.add('btn-disabled');
        btn.onclick = null;
      }
    }
  </script>
</body>
</html>
